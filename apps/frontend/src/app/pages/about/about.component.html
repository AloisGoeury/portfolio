@if (viewModel$ | async; as viewModel) {
    <section class="page-shell page-intro about-intro">
        <p class="eyebrow">{{ viewModel.page.eyebrow }}</p>
        <h1>{{ viewModel.page.title }}</h1>
        <div class="prose" [innerHTML]="viewModel.html"></div>
        <p>
            <a class="text-link" routerLink="/projets">
                {{ viewModel.page.linkLabel }}
            </a>
        </p>
    </section>
}
