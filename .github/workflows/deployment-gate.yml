name: Deployment gate

on:
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    validate-release-commit:
        name: Validate release commit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Validate commit title against package version
              run: node scripts/validate-deploy-commit.mjs
